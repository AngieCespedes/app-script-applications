<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{
  --am:#FFB41D; --am2:#E09C00; --ne:#1A1A1A; --crema:#FFF8E7; --crema2:#FFE7B0;
  --gris:#F4F4F2; --borde:#E2E0DA; --txt:#1A1A1A; --sec:#6B6761;
  --ok:#1E7B34; --okbg:#E6F4EA; --mal:#B3261E; --malbg:#FDECEA; --avi:#8A5A00; --avibg:#FFF1CC;
  --azul:#1F3864;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--txt);background:var(--gris);font-size:14px;line-height:1.45}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
button{font:inherit;cursor:pointer;border:0;border-radius:8px}
input,select,textarea{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--borde);
  border-radius:8px;background:#fff;color:var(--txt)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--am);outline-offset:-1px;border-color:var(--am)}
label{display:block;font-size:11.5px;font-weight:600;color:var(--sec);margin:0 0 4px;
  text-transform:uppercase;letter-spacing:.04em}
.hide{display:none!important}

/* ===== LOGIN ===== */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(140deg,#1A1A1A 0%,#2d2d2d 60%,#3a3122 100%);padding:24px}
.loginbox{background:#fff;border-radius:16px;padding:30px;max-width:390px;width:100%;
  box-shadow:0 18px 50px rgba(0,0,0,.45)}
.logo{width:52px;height:52px;border-radius:12px;background:var(--am);display:flex;
  align-items:center;justify-content:center;font-weight:800;color:var(--ne);font-size:19px;margin-bottom:14px}
.loginbox h1{font-size:19px}
.loginbox p.s{color:var(--sec);font-size:12.5px;margin:4px 0 20px}
.loginbox .f{margin-bottom:12px}
.btn{background:var(--am);color:var(--ne);font-weight:700;padding:11px 16px;width:100%;
  border-radius:9px;transition:.15s}
.btn:hover{background:var(--am2)}
.btn.dark{background:var(--ne);color:#fff}
.btn.dark:hover{background:#000}
.btn.ghost{background:#fff;color:var(--ne);border:1px solid var(--borde);font-weight:600}
.btn.ghost:hover{background:var(--crema)}
.btn.sm{width:auto;padding:7px 12px;font-size:12.5px}
.btn.xs{width:auto;padding:5px 9px;font-size:11.5px;font-weight:600}
.demo{margin-top:18px;border-top:1px solid var(--borde);padding-top:14px}
.demo p{font-size:11px;color:var(--sec);margin:0 0 8px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.demo button{display:block;width:100%;text-align:left;background:var(--crema);border:1px solid var(--crema2);
  padding:9px 11px;margin-bottom:6px;font-size:12.5px;border-radius:8px}
.demo button:hover{background:var(--crema2)}
.demo b{display:block;font-size:13px}
.demo span{color:var(--sec);font-size:11.5px}

/* ===== APP ===== */
#app{display:flex;min-height:100vh}
aside{width:232px;background:var(--ne);color:#fff;flex-shrink:0;display:flex;flex-direction:column}
.brand{padding:16px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #2e2e2e}
.brand .logo{width:34px;height:34px;font-size:13px;border-radius:9px;margin:0}
.brand b{font-size:13.5px;display:block;line-height:1.2}
.brand span{font-size:10.5px;color:#9a948a}
nav{padding:10px 8px;flex:1;overflow:auto}
nav .gr{font-size:10px;color:#7d7870;text-transform:uppercase;letter-spacing:.09em;
  padding:12px 10px 5px;font-weight:700}
nav a{display:flex;gap:9px;align-items:center;padding:9px 10px;color:#ddd8d0;text-decoration:none;
  border-radius:8px;font-size:13.2px;margin-bottom:1px;cursor:pointer}
nav a:hover{background:#262626;color:#fff}
nav a.on{background:var(--am);color:var(--ne);font-weight:700}
nav a .ic{width:17px;text-align:center;font-size:14px}
nav a .pill{margin-left:auto;background:var(--mal);color:#fff;border-radius:9px;
  padding:1px 6px;font-size:10.5px;font-weight:700}
.who{padding:12px 14px;border-top:1px solid #2e2e2e;font-size:12px}
.who b{display:block;color:#fff}
.who span{color:#9a948a;font-size:11px}
.who button{margin-top:8px;background:#262626;color:#ddd;font-size:11.5px;padding:5px 9px;width:auto}

main{flex:1;min-width:0;display:flex;flex-direction:column}
header{background:#fff;border-bottom:1px solid var(--borde);padding:14px 22px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h2{font-size:17px}
header .sub{color:var(--sec);font-size:12.5px}
header .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{background:var(--crema);border:1px solid var(--crema2);border-radius:20px;
  padding:4px 11px;font-size:12px;font-weight:600}
.chip.v{background:var(--okbg);border-color:#bfe3c9;color:var(--ok)}
.chip.r{background:var(--malbg);border-color:#f3c7c3;color:var(--mal)}
.wrap{padding:20px 22px;max-width:1120px}

.card{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:18px;margin-bottom:16px}
.card > h3{font-size:14.5px;margin-bottom:3px}
.card > p.d{color:var(--sec);font-size:12.5px;margin:0 0 14px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:14px}
.kpi span{display:block;font-size:11px;color:var(--sec);text-transform:uppercase;
  letter-spacing:.05em;font-weight:700;margin-bottom:5px}
.kpi b{font-size:21px;display:block;letter-spacing:-.02em}
.kpi small{color:var(--sec);font-size:11.5px}
.kpi.am{background:var(--crema);border-color:var(--crema2)}
.kpi.rojo b{color:var(--mal)}

/* acciones grandes */
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
@media(max-width:900px){.acts{grid-template-columns:1fr 1fr}}
.act{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:15px;text-align:left;
  transition:.15s}
.act:hover{border-color:var(--am);box-shadow:0 4px 14px rgba(0,0,0,.07);transform:translateY(-1px)}
.act .e{font-size:22px;display:block;margin-bottom:7px}
.act b{display:block;font-size:13.5px;margin-bottom:2px}
.act span{color:var(--sec);font-size:11.8px;line-height:1.35;display:block}
.act.pri{background:var(--am);border-color:var(--am2)}
.act.pri span{color:#6b5200}

/* tabla */
table{width:100%;border-collapse:collapse;font-size:12.8px}
th{text-align:left;background:var(--ne);color:#fff;padding:9px 10px;font-weight:600;font-size:11.5px;
  text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
th:first-child{border-radius:8px 0 0 0}th:last-child{border-radius:0 8px 0 0}
td{padding:9px 10px;border-bottom:1px solid var(--borde);vertical-align:top}
tbody tr:hover{background:var(--crema)}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)}
.b-av{background:var(--avibg);color:var(--avi)}
.b-mal{background:var(--malbg);color:var(--mal)}
.b-gr{background:#ECEAE5;color:var(--sec)}

/* alertas */
.al{border-radius:9px;padding:11px 13px;font-size:12.8px;margin-bottom:11px;border:1px solid}
.al-ok{background:var(--okbg);border-color:#bfe3c9;color:#145c27}
.al-av{background:var(--avibg);border-color:#f0d89a;color:#6b4700}
.al-mal{background:var(--malbg);border-color:#f3c7c3;color:#8c1d16}
.al-inf{background:#EDF2FA;border-color:#c9d8ef;color:#1F3864}
.al b{display:block;margin-bottom:2px}
.al .nrm{font-size:11.5px;opacity:.85;display:block;margin-top:4px}

.sep{height:1px;background:var(--borde);margin:16px 0}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.hint{font-size:11.5px;color:var(--sec);margin-top:4px}
.drop{border:2px dashed var(--borde);border-radius:10px;padding:22px;text-align:center;
  background:var(--crema);color:var(--sec);font-size:12.8px;cursor:pointer}
.drop:hover{border-color:var(--am);background:var(--crema2)}

/* comprobante */
.doc{background:#fff;border:1px solid var(--borde);border-radius:10px;padding:24px;
  font-size:12.5px;max-width:720px}
.doc .h{display:flex;gap:14px;align-items:flex-start;border-bottom:2px solid var(--ne);padding-bottom:12px;margin-bottom:14px}
.doc .h .logo{width:44px;height:44px;font-size:15px;margin:0}
.doc .h b{font-size:14px;display:block}
.doc .h span{color:var(--sec);font-size:11.5px}
.doc .h .n{margin-left:auto;text-align:right}
.doc .h .n b{font-size:13px}
.doc dl{display:grid;grid-template-columns:150px 1fr;gap:5px 12px;margin:0 0 14px}
.doc dt{color:var(--sec);font-size:11.5px;font-weight:600}
.doc dd{margin:0;font-weight:600}
.firmas{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:30px}
.firmas div{border-top:1px solid var(--ne);padding-top:6px;font-size:11.5px;color:var(--sec)}

.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.wamsg{background:#E7FFDB;border:1px solid #bfe3a9;border-radius:10px;border-top-right-radius:2px;
  padding:11px 13px;font-size:12.8px;white-space:pre-wrap;line-height:1.5}
.lnk{color:#0B6BCB;word-break:break-all}
.ck{display:flex;gap:8px;align-items:flex-start;font-size:12.8px;font-weight:500;
  text-transform:none;letter-spacing:0;color:var(--txt);margin:0}
.ck input{width:auto;margin-top:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--borde);margin-bottom:16px;flex-wrap:wrap}
.tabs button{background:none;padding:9px 13px;font-size:13px;color:var(--sec);font-weight:600;
  border-radius:8px 8px 0 0;border-bottom:2px solid transparent}
.tabs button.on{color:var(--ne);border-bottom-color:var(--am);background:var(--crema)}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:14px 0}
@media(max-width:900px){.flow{grid-template-columns:1fr}}
.flow div{background:var(--crema);border:1px solid var(--crema2);border-radius:9px;padding:10px;font-size:11.8px}
.flow div b{display:block;font-size:12.5px;margin-bottom:2px}
.flow div.on{background:var(--am);border-color:var(--am2)}
.flow div.off{background:#fff;border-color:var(--borde);color:var(--sec)}
.den{display:grid;grid-template-columns:110px 1fr 120px;gap:8px;align-items:center;margin-bottom:6px}
.den span{font-size:12.5px;font-weight:600}
.den b{text-align:right;font-variant-numeric:tabular-nums}

/* toast y modal */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(120%);
  background:var(--ne);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;max-width:480px;
  box-shadow:0 10px 30px rgba(0,0,0,.3);transition:transform .25s;z-index:900;line-height:1.4}
#toast.on{transform:translateX(-50%) translateY(0)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;
  justify-content:center;padding:20px;z-index:950;overflow:auto}
#modal .mbox{background:#fff;border-radius:14px;max-width:780px;width:100%;max-height:92vh;overflow:auto;
  box-shadow:0 24px 60px rgba(0,0,0,.4)}
#modal .mh{padding:16px 20px;border-bottom:1px solid var(--borde);display:flex;align-items:center;gap:12px;
  position:sticky;top:0;background:#fff;border-radius:14px 14px 0 0}
#modal .mh h3{font-size:15px}
#modal .mh button{margin-left:auto;background:none;color:var(--sec);font-size:20px;padding:0 6px;width:auto}
#modal .mb{padding:20px}

/* ===== CELULAR ===== */
#btnMenu{display:none;background:var(--ne);color:#fff;width:auto;padding:8px 12px;
  font-size:17px;line-height:1;border-radius:9px;flex-shrink:0}
#velo{display:none}
@media(max-width:760px){
  #btnMenu{display:inline-flex;align-items:center}
  aside{position:fixed;top:0;bottom:0;left:0;z-index:700;transform:translateX(-100%);
    transition:transform .22s;box-shadow:0 0 44px rgba(0,0,0,.55)}
  aside.abierto{transform:translateX(0)}
  #velo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:690}
  #velo.abierto{display:block}
  header{position:sticky;top:0;z-index:600;padding:11px 13px;gap:10px}
  header h2{font-size:15.5px}
  header .sub{font-size:11.5px}
  .wrap{padding:14px 13px}
  .card{padding:14px}
  .kpis{grid-template-columns:1fr 1fr}
  .acts{grid-template-columns:1fr}
  .loginbox{padding:24px 20px}
  input,select,textarea{font-size:16px}
  .btn{padding:13px 16px}
  .btn.xs{padding:8px 11px;font-size:12.5px}
  table{font-size:12px}
}
</style>
</head>
<body>

<div id="cargando" style="min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(140deg,#1A1A1A 0%,#2d2d2d 60%,#3a3122 100%);color:#fff;
  flex-direction:column;gap:14px;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif">
  <div class="logo" style="margin:0">SS</div>
  <b style="font-size:17px">Caja Menor</b>
  <span style="font-size:13px;opacity:.75">Social Solar S.A.S. · abriendo…</span>
  <div id="cargaErr" style="max-width:460px;text-align:center;font-size:13px;color:#FFB41D"></div>
</div>

<div id="login" class="hide">
  <div class="loginbox">
    <div class="logo">SS</div>
    <h1>Caja Menor</h1>
    <p class="s">Social Solar S.A.S. · NIT 901.128.826-6</p>

    <div class="f">
      <label>Usuario</label>
      <input id="lg_usr" readonly style="background:#F4F4F2;color:#6B6761">
      <div class="hint" style="color:#1E7B34">✓ Verificado por Google</div>
    </div>

    <div class="f">
      <label>¿Quién está registrando?</label>
      <select id="lg_sel" onchange="lgOtro()"></select>
      <input id="lg_nom" class="hide" placeholder="Nombre y apellido" style="margin-top:8px">
      <div class="hint">Su nombre queda en cada movimiento que guarde.</div>
    </div>

    <button class="btn dark" onclick="entrarQuien()">Ingresar</button>

    <div class="demo">
      <p>Su rol en el sistema</p>
      <div id="lg_roles"></div>
    </div>
  </div>
</div>

<div id="app" class="hide">
  <aside>
    <div class="brand">
      <div class="logo">SS</div>
      <div><b>Caja Menor</b><span>Social Solar S.A.S.</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="who">
      <b id="whoN"></b><span id="whoR"></span>
    </div>
  </aside>

  <main>
<div id="velo" onclick="menu()"></div>
    <header>
      <button id="btnMenu" onclick="menu()" aria-label="Menú">☰</button>
      <div><h2 id="tit"></h2><div class="sub" id="sub"></div></div>
      <div class="right" id="hright"></div>
    </header>
    <div class="wrap" id="view"></div>
  </main>
</div>

<div id="toast"></div>

<script>
/* =========================================================
   CAJA MENOR — SOCIAL SOLAR S.A.S.
   Página web conectada al libro real. Todo lo que se ve
   sale de las hojas; todo lo que se guarda cae en ellas.
   ========================================================= */

var D = null;          /* datos de arranque */
var QUIEN = '';        /* quién está registrando en esta sesión */
try { QUIEN = window.localStorage.getItem('cm_quien') || ''; } catch(e){}
var PANT = 'inicio';
var ROL = 'auxiliar';
var DEN = [100000,50000,20000,10000,5000,2000,1000,500,200,100];

function $(i){ return document.getElementById(i); }
function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function cop(n){ return '$ ' + Math.round(Number(n)||0).toLocaleString('es-CO'); }
function num(v){ return Number(String(v==null?'':v).replace(/[^0-9]/g,''))||0; }

function toast(t, c){
  var e = $('toast');
  e.textContent = t;
  e.className = 'on ' + (c||'');
  e.style.background = c==='mal' ? '#B3261E' : c==='ok' ? '#1E7B34' : '#1A1A1A';
  clearTimeout(window._tt);
  window._tt = setTimeout(function(){ e.className=''; }, 4200);
}

function servidor(fn){
  var args = Array.prototype.slice.call(arguments,1);
  return new Promise(function(ok,mal){
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(mal);
    r[fn].apply(r,args);
  });
}

function leerArchivo(id){
  var el = $(id), f = el && el.files && el.files[0];
  if(!f) return Promise.resolve(null);
  return new Promise(function(ok,mal){
    var r = new FileReader();
    r.onload = function(){ ok({ nombre:f.name, tipo:f.type,
      base64:String(r.result).split(',')[1] }); };
    r.onerror = function(){ mal(new Error('No se pudo leer el archivo.')); };
    r.readAsDataURL(f);
  });
}

function hoyISO(){
  var d=new Date();
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
}

/* ===================== ARRANQUE ===================== */

/* el arranque lo hace arrancar(), más abajo */

/* ===================== MENÚ ===================== */

var MENU = {
  auxiliar: [
    ['OPERACIÓN DIARIA'],
    ['inicio','🏠','Inicio'], ['pago','💸','Registrar pago'],
    ['ingreso','💵','Registrar ingreso'], ['entrega','📤','Entregar efectivo'],
    ['soportes','📷','Leer fotos / PDF'],
    ['ANTES DE PAGAR'],
    ['banca','🔎','¿Puedo pagar en efectivo?'], ['politicas','📘','Políticas'],
    ['banco','🏦','Banco y tope'],
    ['LEGALIZACIÓN'],
    ['links','🔗','Pedir documentos', function(){ return D ? D.pendientes : 0; }],
    ['CIERRE'],
    ['arqueo','🧮','Arqueo'], ['cierre','📨','Entregar la relación'],
    ['informes','📄','Relaciones cerradas'],
    ['confirmar','🤝','Entregas de efectivo'],
    ['empalme','🔁','Entrega del cargo'],
    ['datos','🔗','Enlaces y carpetas']
  ],
  contadora: [
    ['CONTROL'],
    ['tablero','📊','Tablero'], ['gestion','📈','Gestión de la caja'],
    ['casos','🙋','Casos por definir', function(){ return D ? D.casos : 0; }],
    ['revisar','🔍','Revisar la relación'],
    ['auditoria','⚠️','Hallazgos'],
    ['banca','🔎','Bancarización'], ['banco','🏦','Banco y tope'],
    ['REGISTRO'],
    ['inicio','🏠','Relación en curso'], ['pago','💸','Registrar pago'],
    ['ingreso','💵','Registrar ingreso'], ['entrega','📤','Entregar efectivo'],
    ['soportes','📷','Leer fotos / PDF'],
    ['arqueo','🧮','Arqueo'], ['cierre','📨','Entregar la relación'],
    ['CONFIGURACIÓN'],
    ['usuarios','👥','Usuarios y claves'],
    ['politicas','📘','Políticas'], ['links','🔗','Links a proveedores'],
    ['accesos','🧹','Limpiar accesos al libro'],
    ['params','⚙️','Responsables y topes'],
    ['informes','📄','Relaciones cerradas'],
    ['confirmar','🤝','Entregas de efectivo'],
    ['empalme','🔁','Entrega del cargo'],
    ['datos','🔗','Enlaces y carpetas']
  ],
  gerencia: [
    ['REVISIÓN'],
    ['aprobar','✅','Relaciones para aprobar', function(){ return D ? D.porAprobar : 0; }],
    ['informes','📄','Historial de relaciones'],
    ['confirmar','🤝','Efectivo que recibí', function(){ return D ? D.porConfirmar : 0; }],
    ['tablero','📊','Tablero'], ['banco','🏦','Banco y tope'],
    ['auditoria','⚠️','Hallazgos'], ['politicas','📘','Políticas'],
    ['datos','🔗','Enlaces y carpetas']
  ]
};

function pintarNav(){
  var items = MENU[ROL] || MENU.auxiliar;
  $('nav').innerHTML = items.map(function(it){
    if(it.length === 1) return '<div class="gr">'+esc(it[0])+'</div>';
    var n = it[3] ? it[3]() : 0;
    var pill = n ? ' <span class="pill">'+n+'</span>' : '';
    return '<a onclick="ir(\''+it[0]+'\')" data-p="'+it[0]+'">'+
           '<span class="ic">'+it[1]+'</span>'+esc(it[2])+pill+'</a>';

function ir(p){
  try { document.querySelector('aside').classList.remove('abierto');
        document.getElementById('velo').classList.remove('abierto'); } catch(e){}
  PANT = p;
  var V = VISTAS[p];
  if(!V){ toast('Esa pantalla todavía no está.','mal'); return; }
  document.querySelectorAll('#nav a').forEach(function(a){
    a.classList.toggle('on', a.dataset.p === p);
  });
  $('tit').textContent = V.t;
  $('sub').innerHTML = V.s || '';
  $('hright').innerHTML = V.h ? V.h() : '';
  $('view').innerHTML = V.render();
  window.scrollTo(0,0);
  if(V.after) V.after();
}

  return servidor('datosWeb').then(function(d){
    D = d; pintarNav();

function valPago(){
  if(!D || !$('g_val')) return;
  var v = num($('g_valor').value);
  var tipo = $('g_tipo').value||'', nit = ($('g_nit').value||'').replace(/\D/g,'');
  var medio = $('g_medio').value||'', estado = $('g_estado').value||'';
  var benef = $('g_benef').value||'', prov = ($('g_prov').value||'').trim();
  var ret = $('g_ret').value||'';
  var esEfectivo = medio.indexOf('Efectivo') === 0;
  var h = '', bloquea = false;

  if(benef === '__nuevo__' || ($('g_centro') && $('g_centro').value === '__nuevo__')){ bloquea = true;
    h += '<div class="al al-av"><b>Termine de agregar el nombre</b>'+
         'Escríbalo y oprima «Guardar en la lista», o cancele.</div>'; }
  if(!v) h += '<div class="al al-av"><b>Escriba el valor</b>Sin valor no se puede validar nada.</div>';
  if(esEfectivo && v > D.saldo){ bloquea = true;
    h += '<div class="al al-mal"><b>No alcanza el efectivo</b>En caja hay '+cop(D.saldo)+
         ' y está registrando '+cop(v)+'.</div>'; }
  if(v > D.topeGasto){ bloquea = true;
    h += '<div class="al al-mal"><b>Supera el tope por gasto ('+cop(D.topeGasto)+')</b>'+
         'Requiere autorización de gerencia antes de pagarse por caja menor.</div>'; }
  if(esEfectivo && v > D.topeEfectivo){ bloquea = true;
    h += '<div class="al al-mal"><b>'+cop(v)+' en efectivo supera las 100 UVT</b>'+
         'Va obligatoriamente por canal bancario. Art. 771-5 par. 2 E.T.</div>'; }
  else if(!esEfectivo && v)
    h += '<div class="al al-ok"><b>Pago bancarizado</b>'+esc(medio)+
         ' no cuenta contra el tope de efectivo. Oficio DIAN 100202208-0176/2023.</div>';

  if(nit && /^2{9,12}$/.test(nit)){ bloquea = true;
    h += '<div class="al al-mal"><b>NIT genérico de consumidor final</b>'+
         'No soporta nada: exija factura a nombre de Social Solar S.A.S.</div>'; }

  if(tipo.indexOf('papel') > -1){
    if(v > D.topePOS){ bloquea = true;
      h += '<div class="al al-mal"><b>Tiquete POS en papel por '+cop(v)+'</b>'+
           'Supera las 5 UVT ('+cop(D.topePOS)+'). Exija factura electrónica. Art. 616-1 par. 2 E.T.</div>'; }
    else h += '<div class="al al-mal"><b>El POS en papel no es deducible</b>'+
         'Pida documento equivalente electrónico con los datos de Social Solar.</div>';
  }

  if(benef && benef.indexOf('directo') === -1 && prov)
    h += '<div class="al al-inf"><b>Doble trazabilidad</b>El efectivo lo recibió '+esc(benef)+
         ' y el soporte queda a nombre de '+esc(prov)+'. Circular 004 num. 4.E.</div>';
  if(benef && benef.indexOf('directo') === -1 && !prov)
    h += '<div class="al al-av"><b>Falta el vendedor del documento</b>'+
         'El DSE se le hace al vendedor, no a quien hizo la compra.</div>';

  if(/no quiso|no se pudo/i.test(estado))
    h += '<div class="al al-mal"><b>Queda NO DEDUCIBLE</b>'+
         'El caso pasa a la contadora con su nota y entra al informe mensual. Circular 004 num. 4.G.</div>';
  if(/falta el dse/i.test(estado))
    h += '<div class="al al-av"><b>Queda con reloj de plazo</b>'+D.plazoDSE+
         ' días desde la operación. Después pierde el efecto fiscal.</div>';

  if(ret.indexOf('No aplica') === 0 && v > 500000)
    h += '<div class="al al-av"><b>¿Seguro que no hay retención?</b>Por '+cop(v)+
         ' vale la pena revisar el concepto.</div>';

  if(!h) h = '<div class="al al-ok"><b>Todo en orden</b>Cumple topes, medio de pago y soporte.</div>';
  if(bloquea) h = '<div class="al al-mal"><b>⛔ No se puede guardar así</b>'+
                  'Corrija lo que está en rojo.</div>' + h;
  $('g_val').innerHTML = h;
  $('g_btn').disabled = bloquea;
}

function guardarPago(){
  $('g_btn').disabled = true; toast('Guardando el pago…');
  leerArchivo('g_file').then(function(a){
    return servidor('guardarPago', {
      fecha:$('g_fecha').value, valor:$('g_valor').value,
      beneficiario:$('g_benef').value, proveedor:$('g_prov').value, nit:$('g_nit').value,
      descripcion:$('g_desc').value, medio:$('g_medio').value,
      categoria:$('g_cat').value, centro:$('g_centro').value,

function destEnt(){
  if(!$('e_destino')) return;
  $('e_nueva').classList.toggle('hide', $('e_destino').value !== '__nueva__');
  valEnt();
}
function addPersona(){
  var n = ($('e_pnombre').value||'').trim();
  if(!n){ toast('Escriba el nombre.','mal'); return; }
  D.destinos.push(n);
  var sel = $('e_destino');
  sel.innerHTML = opciones(D.destinos) + '<option value="__nueva__">+ Agregar una persona…</option>';
  sel.value = n;
  $('e_pnombre').value = '';
  destEnt();
  toast(n + ' quedó en la lista de destinos.','ok');
}
function valEnt(){
  if(!D || !$('e_val')) return;
  var v = num($('e_valor').value), d = $('e_destino').value||'';
  var h='', bloquea=false;
  if(d === '__nueva__'){ bloquea = true;
    h += '<div class="al al-av"><b>Elija o agregue una persona</b></div>'; }
  if(v > D.saldo){ bloquea = true;
    h += '<div class="al al-mal"><b>No alcanza</b>En caja hay '+cop(D.saldo)+'.</div>'; }
  if(v && D.excedente > 0 && /banco|consignaci/i.test(d) && v < D.excedente)
    h += '<div class="al al-av"><b>El excedente es '+cop(D.excedente)+'</b>'+
         'Está consignando '+cop(v)+'. La caja quedaría todavía por encima del objetivo.</div>';
  $('e_val').innerHTML = h;
  $('e_btn').disabled = bloquea;
}
function guardarEntrega(){
  $('e_btn').disabled = true; toast('Generando el comprobante…');
  leerArchivo('e_file').then(function(a){
    return servidor('guardarEntrega', {
      destino:$('e_destino').value, valor:$('e_valor').value,
      concepto:$('e_concepto').value, centro:$('e_centro').value, archivo:a, quien:QUIEN
    });
  }).then(function(r){
    D = r.panel; pintarNav();
    toast('Comprobante '+r.consecutivo+' generado.','ok');
    $('e_valor').value=''; $('e_concepto').value=''; $('e_file').value=''; valEnt();
  }).catch(function(e){ toast(e.message,'mal'); $('e_btn').disabled=false; });
}

function calcArqueo(){
  var t = 0;
  DEN.forEach(function(d,i){
    var q = Number($('d'+i).value)||0, v = q*d; t += v;
    $('s'+i).textContent = v ? cop(v) : '—';
  });
  $('a_total').textContent = cop(t);
  var dif = t - D.saldo;
  $('a_dif').textContent = (dif>0?'+ ':dif<0?'− ':'')+cop(Math.abs(dif));
  $('a_dif').style.color = dif===0 ? '#1E7B34' : '#B3261E';
}

  render: function(){

      'Subir los archivos</button>'+

      '<div id="lt_fichas"></div>';
  }

function subirLote(){
  var el = $('lt_files');
  if(!el.files || !el.files.length){ toast('Elija al menos un archivo.','mal'); return; }
  if(el.files.length > 20){ toast('Máximo 20 archivos por tanda.','mal'); return; }
  $('lt_btn').disabled = true;
  $('lt_sub').innerHTML = '<div class="al al-inf">Subiendo '+el.files.length+' archivo(s)…</div>';
  var lecturas = [];
  for(var i=0;i<el.files.length;i++) lecturas.push(leerUno(el.files[i]));
  Promise.all(lecturas).then(function(archivos){
    return servidor('subirLote', archivos);
  }).then(function(r){
    D = r.panel; pintarNav();
    var ok = r.archivos.filter(function(a){ return a.ok; });
    var mal = r.archivos.filter(function(a){ return !a.ok; });
    $('lt_sub').innerHTML =
      '<div class="al al-ok"><b>'+ok.length+' archivo(s) en Drive</b>'+
      '<a href="'+r.carpeta+'" target="_blank" rel="noopener">Ver la carpeta 00 POR CLASIFICAR →</a></div>'+
      (mal.length ? '<div class="al al-mal"><b>'+mal.length+' no se pudieron subir</b>'+
        mal.map(function(a){ return esc(a.nombre)+': '+esc(a.error); }).join('<br>')+'</div>' : '');
    pintarFichas(ok);
    $('lt_btn').disabled = false;
    $('lt_files').value = '';
  }).catch(function(e){
    $('lt_sub').innerHTML = '<div class="al al-mal">'+esc(e.message)+'</div>';
    $('lt_btn').disabled = false;
  });
}

function leerUno(f){
  return new Promise(function(ok,mal){
    var r = new FileReader();
    r.onload = function(){ ok({ nombre:f.name, tipo:f.type, base64:String(r.result).split(',')[1] }); };
    r.onerror = function(){ mal(new Error('No se pudo leer '+f.name)); };
    r.readAsDataURL(f);
  });
}

          '<div><label>Tipo de soporte</label><select id="f_tipo'+i+'">'+opciones(D.soportes)+'</select></div>'+
        '</div>'+

          '<div><label>Tercero del documento</label><input id="f_prov'+i+'"></div>'+

function registrarLote(n){
  var fichas = [];
  for(var i=0;i<n;i++){
    var v = num($('f_valor'+i).value);
    if(!v) continue;
    fichas.push({
      idArchivo: $('fc'+i).dataset.id,
      nombreArchivo: $('fc'+i).querySelector('a').textContent,
      fecha:$('f_fecha'+i).value, valor:$('f_valor'+i).value,
      soporte:$('f_sop'+i).value, tipoSoporte:$('f_tipo'+i).value,
      proveedor:$('f_prov'+i).value, nit:$('f_nit'+i).value,
      categoria:$('f_cat'+i).value, centro:$('f_centro'+i).value,
      beneficiario:$('f_benef'+i).value, medio:$('f_medio'+i).value,
      estadoSoporte:$('f_estado'+i).value, descripcion:$('f_desc'+i).value, quien:QUIEN
    });
  }

var TOKEN = '';
try { TOKEN = window.sessionStorage.getItem('cm_token') || ''; } catch(e){}

/* el servidor crudo: solo para entrar y salir */
function crudo(fn){
  var args = Array.prototype.slice.call(arguments,1);
  return new Promise(function(ok,mal){
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(mal);
    r[fn].apply(r,args);
  });
}

/* todo lo demás pasa por la puerta única, con el token */
function servidor(fn){
  var args = Array.prototype.slice.call(arguments,1);
  return new Promise(function(ok,mal){
    google.script.run
      .withSuccessHandler(ok)
      .withFailureHandler(function(e){
        if(String(e.message||'').indexOf('SIN_SESION') > -1){
          TOKEN = '';
          try { window.sessionStorage.removeItem('cm_token'); } catch(x){}
          abrirLogin('Su sesión se cerró. Vuelva a entrar.');
          mal(new Error('Sesión cerrada.'));
          return;
        }
        mal(e);
      })
      .api(TOKEN, fn, args);
  });
}

    'onkeydown="if(event.key===\'Enter\')guardarClave(\''+esc(usuario)+'\',\''+esc(nombre)+'\')"></div>'+
    '<div style="display:flex;align-items:flex-end;padding-bottom:4px">'+
    '<label class="ck"><input type="checkbox" id="rc_cambiar" checked> '+
    'Pedirle que la cambie al entrar</label></div>'+
    '</div>'+
    '<div class="row" style="margin-top:12px">'+
    '<button class="btn dark sm" onclick="guardarClave(\''+esc(usuario)+'\',\''+esc(nombre)+'\')">Guardar</button>'+
    '<button class="btn ghost sm" onclick="cargarUsuarios()">Cancelar</button>'+
    '</div></div>';
  try { $('rc_cla').focus(); } catch(e){}
}

function guardarClave(usuario, nombre){
  var c = $('rc_cla').value || '';
  var pide = $('rc_cambiar').checked;
  servidor('restablecerClave', usuario, c, pide).then(function(){
    toast('Clave cambiada. Entréguesela a ' + nombre + '.','ok');
    cargarUsuarios();
  }).catch(function(e){ toast(e.message,'mal'); });
}

arrancar();


/* el cajón del menú en el celular */
function menu(){
  var a = document.querySelector('aside'), v = document.getElementById('velo');
  if(!a || !v) return;
  var abierto = a.classList.toggle('abierto');
  v.classList.toggle('abierto', abierto);
}

</script>
