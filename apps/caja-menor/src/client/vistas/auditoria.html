<script>
/* ---------------- AUDITORÍA ---------------- */
VISTAS.auditoria = {
  t: 'Hallazgos',
  s: 'Lo que hay que corregir antes de cerrar y lo que conviene mirar.',
  render: function(){ return '<div id="au_cont">Revisando…</div>'; },
  after: function(){
    servidor('datosAuditoria').then(function(a){
      var h = '';
      if(!a.errores.length && !a.avisos.length)
        h += '<div class="al al-ok"><b>Sin hallazgos</b>'+a.movimientos+
             ' movimientos revisados, saldo '+esc(a.saldo)+'.</div>';
      if(a.errores.length) h += '<div class="card"><h3>Hay que corregirlo antes de cerrar</h3>'+
        a.errores.map(function(e){ return '<div class="al al-mal">'+esc(e)+'</div>'; }).join('')+'</div>';
      if(a.avisos.length) h += '<div class="card"><h3>Para tener en cuenta</h3>'+
        a.avisos.map(function(e){ return '<div class="al al-av">'+esc(e)+'</div>'; }).join('')+'</div>';
      if(a.conAlerta.length) h += '<div class="card"><h3>Movimientos con alerta</h3>'+
        '<div class="tw"><table><thead><tr><th>N.°</th><th>Fecha</th><th>Tercero</th>'+
        '<th class="num">Valor</th><th>Qué dice</th></tr></thead><tbody>'+
        a.conAlerta.map(function(f){
          return '<tr><td>'+f.n+'</td><td>'+esc(f.fecha)+'</td><td>'+esc(f.tercero)+'</td>'+
            '<td class="num">'+esc(f.valor)+'</td>'+
            '<td><span class="badge b-mal">'+esc(f.revision)+'</span></td></tr>';
        }).join('')+'</tbody></table></div></div>';
      h += '<div class="card"><h3>Semáforo de cumplimiento</h3><ul style="margin:0;padding-left:18px">'+
        a.semaforo.map(function(l){ return '<li style="margin-bottom:4px">'+esc(l)+'</li>'; }).join('')+
        '</ul></div>';
      $('au_cont').innerHTML = h;
    }).catch(function(e){ $('au_cont').innerHTML='<div class="al al-mal">'+esc(e.message)+'</div>'; });
  }
};

</script>
