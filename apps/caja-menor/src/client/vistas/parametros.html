<script>
/* ---------------- PARÁMETROS ---------------- */
VISTAS.params = {
  t: 'Responsables y topes',
  s: 'Quién ha tenido la caja y con qué reglas se opera.',
  render: function(){ return '<div id="pa_cont">Consultando…</div>'; },
  after: function(){
    servidor('datosParams').then(function(p){
      $('pa_cont').innerHTML =
        '<div class="al al-inf"><b>Responsable de la caja hoy: '+esc(p.actual)+'</b>'+
        'Sale de las fechas de inicio y retiro de la tabla de abajo.</div>'+
        '<div class="card"><h3>Usuarios y roles</h3>'+
        '<p class="d">El correo con el que entra cada persona decide qué pantallas ve. '+
        'Solo la contadora puede cambiarlo.</p>'+
        '<div class="grid g3">'+
        '<div><label>Contadora</label><input id="rl_ctd" value="'+esc(p.roles?p.roles.ctd:'')+'"></div>'+
        '<div><label>Auxiliar — quien maneja la caja</label><input id="rl_aux" value="'+esc(p.roles?p.roles.aux:'')+'"></div>'+
        '<div><label>Gerencia</label><input id="rl_ger" value="'+esc(p.roles?p.roles.ger:'')+'"></div>'+
        '</div>'+
        (p.puedeEditar
          ? '<button class="btn dark" onclick="guardarRolesWeb()" style="margin-top:12px;max-width:240px">Guardar los roles</button>'
          : '<div class="al al-av" style="margin-top:12px"><b>Solo lectura</b>Entró como '+esc(p.yo||'')+
            '. Para cambiar los roles hay que entrar con el correo de la contadora.</div>')+
        '<div class="al al-inf" style="margin-top:12px"><b>Dos cosas distintas</b>'+
        'Esto decide qué VE cada quien. Que pueda ENTRAR depende de que el libro esté compartido con ese correo.</div>'+
        '</div>'+
        '<div class="card"><h3>Responsables</h3>'+
        '<div class="tw"><table><thead><tr><th>Nombre</th><th>Cédula</th><th>Correo</th>'+
        '<th>Desde</th><th>Hasta</th><th>Estado</th></tr></thead><tbody>'+
        p.responsables.map(function(r){
          var act = (r.estado||'').indexOf('ACTIVO') === 0;
          return '<tr><td><b>'+esc(r.nombre)+'</b></td><td>'+esc(r.cedula)+'</td>'+
            '<td>'+esc(r.correo)+'</td><td>'+esc(r.desde)+'</td><td>'+esc(r.hasta)+'</td>'+
            '<td><span class="badge '+(act?'b-ok':'b-gr')+'">'+esc(r.estado)+'</span></td></tr>';
        }).join('')+'</tbody></table></div>'+
        '<h3 style="margin-top:18px">Agregar a quien recibe la caja</h3>'+
        '<div class="grid g3">'+
        '<div><label>Nombre completo</label><input id="r_nombre"></div>'+
        '<div><label>Cédula</label><input id="r_cedula"></div>'+
        '<div><label>Correo</label><input id="r_correo"></div></div>'+
        '<div class="grid g3" style="margin-top:10px">'+
        '<div><label>Celular</label><input id="r_celular"></div>'+
        '<div><label>Desde</label><input type="date" id="r_desde"></div>'+
        '<div><label>Hasta (opcional)</label><input type="date" id="r_hasta"></div></div>'+
        '<button class="btn dark" onclick="addResp()" style="margin-top:12px;max-width:220px">Agregar</button>'+
        '</div>'+
        '<div class="card"><h3>Topes y correos</h3><div class="tw"><table><tbody>'+
        p.parametros.map(function(x){
          return '<tr><td>'+esc(x.etiqueta)+'</td><td class="num"><b>'+esc(x.valor)+'</b></td></tr>';
        }).join('')+'</tbody></table></div>'+
        '<p class="d" style="margin-top:12px">Para cambiar un tope o un correo, edítelo en la hoja '+
        '<b>Listas</b> del libro. Aquí solo se muestran.</p></div>';
    }).catch(function(e){ $('pa_cont').innerHTML='<div class="al al-mal">'+esc(e.message)+'</div>'; });
  }
};
function guardarRolesWeb(){
  toast('Guardando los roles…');
  servidor('guardarRoles', {
    contadora: $('rl_ctd').value,
    auxiliar:  $('rl_aux').value,
    gerencia:  $('rl_ger').value
  }).then(function(){
    toast('Roles guardados. Cada quien verá su menú la próxima vez que entre.','ok');
    recargar().then(function(){ ir('params'); });
  }).catch(function(e){ toast(e.message,'mal'); });
}

function addResp(){
  servidor('agregarResponsable', {
    nombre:$('r_nombre').value, cedula:$('r_cedula').value, correo:$('r_correo').value,
    celular:$('r_celular').value, desde:$('r_desde').value, hasta:$('r_hasta').value
  }).then(function(){ toast('Responsable agregado.','ok'); ir('params'); })
    .catch(function(e){ toast(e.message,'mal'); });
}

</script>
