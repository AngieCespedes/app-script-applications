function $(i){ return document.getElementById(i); }
function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function cop(n){ return '$ ' + Math.round(Number(n)||0).toLocaleString('es-CO'); }
function num(v){ return Number(String(v==null?'':v).replace(/[^0-9]/g,''))||0; }

function toast(t, c){
  var e = $('toast');
  e.textContent = t;
  e.className = 'on ' + (c||'');
  e.style.background = c==='mal' ? '#B3261E' : c==='ok' ? '#1E7B34' : '#1A1A1A';
  clearTimeout(window._tt);
  window._tt = setTimeout(function(){ e.className=''; }, 4200);
}


function leerArchivo(id){
  var el = $(id), f = el && el.files && el.files[0];
  if(!f) return Promise.resolve(null);
  return new Promise(function(ok,mal){
    var r = new FileReader();
    r.onload = function(){ ok({ nombre:f.name, tipo:f.type,
      base64:String(r.result).split(',')[1] }); };
    r.onerror = function(){ mal(new Error('No se pudo leer el archivo.')); };
    r.readAsDataURL(f);
  });
}

function hoyISO(){
  var d=new Date();
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
}

function pintarNav(){
  var items = MENU[ROL] || MENU.auxiliar;
  $('nav').innerHTML = items.map(function(it){
    if(it.length === 1) return '<div class="gr">'+esc(it[0])+'</div>';
    var n = it[3] ? it[3]() : 0;
    var pill = n ? ' <span class="pill">'+n+'</span>' : '';
    return '<a onclick="ir(\''+it[0]+'\')" data-p="'+it[0]+'">'+
           '<span class="ic">'+it[1]+'</span>'+esc(it[2])+pill+'</a>';
  }).join('');
}

function ir(p){
  try { document.querySelector('aside').classList.remove('abierto');
        document.getElementById('velo').classList.remove('abierto'); } catch(e){}
  PANT = p;
  var V = VISTAS[p];
  if(!V){ toast('Esa pantalla todavía no está.','mal'); return; }
  document.querySelectorAll('#nav a').forEach(function(a){
    a.classList.toggle('on', a.dataset.p === p);
  });
  $('tit').textContent = V.t;
  $('sub').innerHTML = V.s || '';
  $('hright').innerHTML = V.h ? V.h() : '';
  $('view').innerHTML = V.render();
  window.scrollTo(0,0);
  if(V.after) V.after();
}

function recargar(){
  return servidor('datosWeb').then(function(d){
    D = d; pintarNav();
    if($('hright') && VISTAS[PANT] && VISTAS[PANT].h) $('hright').innerHTML = VISTAS[PANT].h();
    return d;
  });
}

function semaforo(){
  if(!D) return '';
  if(D.excedente > 0) return '<div class="al al-mal"><b>⬆ La caja está '+cop(D.excedente)+

    '<div style="margin-top:8px"><button class="btn xs dark" onclick="ir(\'entrega\')">'+
    'Registrar la consignación →</button></div></div>';

}

function opciones(lista, sel){
  return (lista||[]).map(function(x){
    return '<option'+(x===sel?' selected':'')+'>'+esc(x)+'</option>';
