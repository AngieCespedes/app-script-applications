<script>
/* ============================================================
 *  ENTRADA CON USUARIO Y CONTRASEÑA
 * ============================================================ */

var TOKEN = '';
try { TOKEN = window.sessionStorage.getItem('cm_token') || ''; } catch(e){}

/* acciones públicas (entrar, salir, primer uso): misma puerta, sin token */
function crudo(fn){
  var args = Array.prototype.slice.call(arguments,1);
  return new Promise(function(ok,mal){
    google.script.run.withSuccessHandler(ok).withFailureHandler(mal).api('', fn, args);
  });
}

/* todo lo demás pasa por la puerta única, con el token */
function servidor(fn){
  var args = Array.prototype.slice.call(arguments,1);
  return new Promise(function(ok,mal){
    google.script.run
      .withSuccessHandler(ok)
      .withFailureHandler(function(e){
        if(String(e.message||'').indexOf('SIN_SESION') > -1){
          TOKEN = '';
          try { window.sessionStorage.removeItem('cm_token'); } catch(x){}
          abrirLogin('Su sesión se cerró. Vuelva a entrar.');
          mal(new Error('Sesión cerrada.'));
          return;
        }
        mal(e);
      })
      .api(TOKEN, fn, args);
  });
}

function arrancar(){
  if(!TOKEN){ primeraPantalla(); return; }
  servidor('datosWeb').then(function(d){
    montarApp(d);
  }).catch(function(){ primeraPantalla(); });
}

function primeraPantalla(){
  crudo('hayUsuarios').then(function(hay){
    $('cargando').classList.add('hide');
    if(hay) abrirLogin('');
    else    abrirPrimerUso();
  }).catch(function(e){
    $('cargaErr').innerHTML = 'No se pudo abrir el libro.<br><br>' + esc(e.message);
  });
}

function montarApp(d){
  D = d;
  ROL = d.rol;
  QUIEN = d.quien || '';
  $('cargando').classList.add('hide');
  $('login').classList.add('hide');
  $('app').classList.remove('hide');
  $('whoN').textContent = d.quien || d.usuario || '';
  $('whoR').innerHTML = (ROL === 'contadora' ? 'Contadora · revisa y cierra'
                       : ROL === 'gerencia'  ? 'Gerencia · aprueba'
                       : 'Quien maneja la caja') +
    '<br><a onclick="salir()" style="cursor:pointer;color:#FFB41D;font-size:11px">Cerrar sesión</a>' +
    ' · <a onclick="ir(\'miclave\')" style="cursor:pointer;color:#9a948a;font-size:11px">Cambiar clave</a>';
  if(d.modoPrueba) $('whoR').innerHTML += '<br><span style="color:#FFB41D;font-size:11px">MODO PRUEBA · los correos solo le llegan a la dueña</span>';
  pintarNav();
  ir(d.debeCambiar ? 'miclave' : 'inicio');
  if(d.debeCambiar) toast('Por seguridad, cambie la contraseña que le dieron.','av');
}

function abrirLogin(aviso){
  $('cargando').classList.add('hide');
  $('app').classList.add('hide');
  $('login').classList.remove('hide');
  $('login').innerHTML =
    '<div class="loginbox">'+
      '<div class="logo">SS</div>'+
      '<h1>Caja Menor</h1>'+
      '<p class="s">Social Solar S.A.S. · NIT 901.128.826-6</p>'+
      (aviso ? '<div class="al al-av" style="margin-bottom:12px">'+esc(aviso)+'</div>' : '')+
      '<div class="f"><label>Usuario</label>'+
      '<input id="lg_usr" autocomplete="username" placeholder="nombre.apellido" '+
      'onkeydown="if(event.key===\'Enter\')$(\'lg_cla\').focus()"></div>'+
      '<div class="f"><label>Contraseña</label>'+
      '<input id="lg_cla" type="password" autocomplete="current-password" placeholder="••••••••" '+
      'onkeydown="if(event.key===\'Enter\')entrar()"></div>'+
      '<button class="btn dark" id="lg_btn" onclick="entrar()">Ingresar</button>'+
      '<div id="lg_msg"></div>'+
      '<div class="demo">'+
        '<p>Los tres roles</p>'+
        '<div style="border:1px solid #E2E0DA;background:#fff;border-radius:8px;padding:9px 11px;margin-bottom:6px">'+
          '<b style="display:block;font-size:13px">👩‍💼 Quien tiene la caja</b>'+
          '<span style="color:#6B6761;font-size:11.5px">Registra pagos, ingresos y entregas. Sube soportes y hace el arqueo.</span></div>'+
        '<div style="border:1px solid #E2E0DA;background:#fff;border-radius:8px;padding:9px 11px;margin-bottom:6px">'+
          '<b style="display:block;font-size:13px">📊 Contadora</b>'+
          '<span style="color:#6B6761;font-size:11.5px">Revisa, audita y cierra. Administra los usuarios.</span></div>'+
        '<div style="border:1px solid #E2E0DA;background:#fff;border-radius:8px;padding:9px 11px">'+
          '<b style="display:block;font-size:13px">✅ Gerencia</b>'+
          '<span style="color:#6B6761;font-size:11.5px">Aprueba relaciones y confirma el efectivo recibido.</span></div>'+
      '</div>'+
      '<p style="font-size:11px;color:#6B6761;margin:14px 0 0;text-align:center">'+
      '¿Olvidó su contraseña? La contadora se la restablece.</p>'+
    '</div>';
  setTimeout(function(){ try { $('lg_usr').focus(); } catch(e){} }, 120);
}

function entrar(){
  var u = ($('lg_usr').value||'').trim(), c = $('lg_cla').value||'';
  if(!u || !c){ msgLogin('Escriba usuario y contraseña.','al-av'); return; }
  $('lg_btn').disabled = true;
  msgLogin('Entrando…','al-inf');
  crudo('iniciarSesion', u, c).then(function(s){
    TOKEN = s.token;
    try { window.sessionStorage.setItem('cm_token', s.token); } catch(e){}
    return servidor('datosWeb');
  }).then(function(d){
    montarApp(d);
    toast('Bienvenida, ' + (d.quien||'') + '.','ok');
  }).catch(function(e){
    msgLogin(e.message, 'al-mal');
    $('lg_btn').disabled = false;
    try { $('lg_cla').value=''; $('lg_cla').focus(); } catch(x){}
  });
}

function msgLogin(t, clase){
  var e = $('lg_msg');
  if(e) e.innerHTML = '<div class="al '+clase+'" style="margin-top:12px">'+esc(t)+'</div>';
}

function salir(){
  var t = TOKEN;
  TOKEN = '';
  try { window.sessionStorage.removeItem('cm_token'); } catch(e){}
  crudo('cerrarSesion', t).catch(function(){});
  abrirLogin('Cerró la sesión.');
}

function abrirPrimerUso(){
  $('app').classList.add('hide');
  $('login').classList.remove('hide');
  $('login').innerHTML =
    '<div class="loginbox">'+
      '<div class="logo">SS</div>'+
      '<h1>Primera vez</h1>'+
      '<p class="s">Todavía no hay usuarios. Cree el de la contadora.</p>'+
      '<div class="al al-av"><b>Hágalo ahora mismo</b>'+
      'Mientras no exista, cualquiera que abra este enlace podría crearlo.</div>'+
      '<div class="f"><label>Nombre completo</label><input id="pu_nom" placeholder="Angie Paola Céspedes Portela"></div>'+
      '<div class="f"><label>Usuario</label><input id="pu_usr" placeholder="angie"></div>'+
      '<div class="f"><label>Contraseña</label><input id="pu_cla" type="password" placeholder="mínimo 8 caracteres"></div>'+
      '<div class="f"><label>Repita la contraseña</label><input id="pu_cl2" type="password" '+
      'onkeydown="if(event.key===\'Enter\')crearAdmin()"></div>'+
      '<button class="btn dark" id="pu_btn" onclick="crearAdmin()">Crear y entrar</button>'+
      '<div id="lg_msg"></div>'+
      '<p style="font-size:11px;color:#6B6761;margin:14px 0 0">'+
      'Esta contraseña no la ve nadie: se guarda cifrada. Si se le olvida, se restablece, no se recupera.</p>'+
    '</div>';
}

function crearAdmin(){
  var n = ($('pu_nom').value||'').trim(), u = ($('pu_usr').value||'').trim();
  var c = $('pu_cla').value||'', c2 = $('pu_cl2').value||'';
  if(!n || !u || !c){ msgLogin('Llene los cuatro campos.','al-av'); return; }
  if(c !== c2){ msgLogin('Las dos contraseñas no coinciden.','al-mal'); return; }
  $('pu_btn').disabled = true;
  msgLogin('Creando…','al-inf');
  crudo('crearAdministradora', { nombre:n, usuario:u, clave:c }).then(function(s){
    TOKEN = s.token;
    try { window.sessionStorage.setItem('cm_token', s.token); } catch(e){}
    return servidor('datosWeb');
  }).then(function(d){
    montarApp(d);
    toast('Listo. Ya puede crear los demás usuarios en la pantalla Usuarios.','ok');
  }).catch(function(e){
    msgLogin(e.message,'al-mal');
    $('pu_btn').disabled = false;
  });
}

VISTAS.miclave = {
  t: 'Cambiar mi contraseña',
  s: 'Solo usted la conoce. Nadie puede verla, ni la contadora.',
  render: function(){
    return '<div class="card" style="max-width:480px">'+
      '<h3>Su contraseña</h3>'+
      '<label>Contraseña actual</label><input id="mc_vieja" type="password">'+
      '<label style="margin-top:10px">Contraseña nueva</label>'+
      '<input id="mc_nueva" type="password" placeholder="mínimo 8 caracteres">'+
      '<label style="margin-top:10px">Repítala</label>'+
      '<input id="mc_rep" type="password" onkeydown="if(event.key===\'Enter\')cambiarClave()">'+
      '<button class="btn dark" onclick="cambiarClave()" style="margin-top:14px">Cambiar</button>'+
      '<div id="mc_msg"></div></div>'+
      '<div class="al al-inf"><b>Si se le olvida</b>'+
      'No se puede recuperar, porque está cifrada. La contadora le pone una nueva desde la pantalla Usuarios.</div>';
  }
};

function cambiarClave(){
  var v = $('mc_vieja').value||'', n = $('mc_nueva').value||'', r = $('mc_rep').value||'';
  if(!v || !n){ toast('Llene los campos.','mal'); return; }
  if(n !== r){ toast('Las dos contraseñas nuevas no coinciden.','mal'); return; }
  servidor('cambiarMiClave', D.usuario, v, n).then(function(){
    $('mc_msg').innerHTML = '<div class="al al-ok" style="margin-top:12px">'+
      '<b>Contraseña cambiada</b>De ahora en adelante entre con la nueva.</div>';
    ['mc_vieja','mc_nueva','mc_rep'].forEach(function(i){ $(i).value=''; });
    toast('Contraseña cambiada.','ok');
  }).catch(function(e){ toast(e.message,'mal'); });
}


</script>
