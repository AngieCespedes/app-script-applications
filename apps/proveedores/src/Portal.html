<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#F4F6F9;color:#1a1a1a}
a{color:#0F3B5C}
/* ---- entrada ---- */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#0F3B5C}
.lbox{background:#fff;border-radius:14px;max-width:420px;width:100%;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.lhead{background:#0F3B5C;padding:24px;text-align:center;color:#fff}
.lhead h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.5px}
.lhead p{margin:6px 0 0;font-size:12.5px;color:#BFD3E2}
.lbody{padding:24px}
/* ---- marco ---- */
.top{background:#0F3B5C;padding:13px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.top h1{margin:0;font-size:14.5px;font-weight:700;color:#fff;letter-spacing:.4px}
.top .yo{font-size:11.5px;color:#BFD3E2;margin-top:2px}
.top .der{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lnk{font-size:11.5px;color:#BFD3E2;cursor:pointer;text-decoration:underline}
.rayita{height:3px;background:#F2A81D}
.tabs{background:#fff;border-bottom:1px solid #DDE3E8;padding:0 14px;display:flex;gap:2px;overflow-x:auto}
.tab{padding:12px 14px;font-size:13px;font-weight:600;color:#5A6670;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:#0F3B5C;border-bottom-color:#F2A81D}
.tab .n{background:#FDE2E2;color:#B00020;border-radius:20px;padding:1px 7px;font-size:11px;margin-left:5px;font-weight:700}
.wrap{padding:16px;max-width:1180px;margin:0 auto}
/* ---- piezas ---- */
.card{background:#fff;border:1px solid #DDE3E8;border-radius:10px;padding:16px 18px;margin-bottom:14px}
.sec{font-size:11px;font-weight:700;letter-spacing:1.1px;color:#5A6670;border-bottom:1px solid #e5e8ec;padding-bottom:6px;margin:0 0 13px}
label{display:block;font-size:12.5px;font-weight:600;color:#3D4A54;margin-bottom:5px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #d6dbe0;border-radius:7px;font-size:14px;font-family:inherit;background:#fff}
textarea{height:70px;resize:vertical}
.tbl{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.tbl th{background:#F4F6F8;color:#5A6670;text-align:left;font-size:10.5px;letter-spacing:.4px;padding:9px 10px;border-bottom:1px solid #E4E9ED;white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid #EEF1F4;vertical-align:top;word-wrap:break-word;overflow-wrap:anywhere}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl .num{text-align:right}
.mini{font-size:11px;color:#8A94A0;margin-top:2px}
.g{margin-bottom:12px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>div{flex:1;min-width:150px}
.btn{padding:13px 18px;background:#1a1a1a;color:#fff;border:0;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.5;cursor:default}
.btn2{padding:9px 14px;background:#fff;color:#0F3B5C;border:1px solid #9FC0DA;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block}
.btnok{background:#2E6B2E}
.btnno{background:#fff;color:#B00020;border:1px solid #F3B5B5}
.pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.3px;padding:3px 9px;border-radius:20px;white-space:nowrap}
.ok{background:#E3F0DC;color:#2E6B2E}
.wait{background:#FDF0D2;color:#8A6D1F}
.bad{background:#FDE2E2;color:#B00020}
.inf{background:#E6EEF6;color:#0F3B5C}
.gris{background:#EEF0F3;color:#5A6670}
.caja{border-radius:8px;padding:12px 14px;font-size:13px;line-height:1.55;margin-top:10px}
.cok{background:#F2F8EE;border:1px solid #B9D9A8;color:#2E6B2E}
.cno{background:#FDE2E2;border:1px solid #F3B5B5;color:#8A1F2E}
.cav{background:#FDF0D2;color:#6B5420}
/* ---- guia ---- */
.guia{background:#fff;border:1px solid #9FC0DA;border-left:4px solid #0F3B5C;border-radius:10px;padding:15px 18px;margin-bottom:14px}
.guia h3{margin:0 0 8px;font-size:13.5px;color:#0F3B5C}
.guia ol{margin:0;padding-left:19px;font-size:13px;color:#3D4A54;line-height:1.75}
.guia p{margin:9px 0 0;font-size:12.3px;color:#5A6670;line-height:1.6}
/* ---- indicadores ---- */
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.kpi{background:#fff;border:1px solid #DDE3E8;border-radius:10px;padding:13px 15px;flex:1;min-width:118px}
.kpi b{display:block;font-size:24px;color:#0F3B5C;line-height:1}
.kpi span{font-size:11px;color:#5A6670;display:block;margin-top:4px;line-height:1.3}
/* ---- ordenes ---- */
.ord{background:#fff;border:1px solid #DDE3E8;border-radius:10px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
.ord:hover{border-color:#9FC0DA}
.ord .l1{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.ord .num{font-size:13.5px;font-weight:700;color:#0F3B5C}
.ord .l2{font-size:12.5px;color:#3D4A54;margin-top:5px}
.ord .l3{font-size:11.5px;color:#8A94A0;margin-top:3px}
.det{display:grid;grid-template-columns:1fr 1fr;gap:7px 16px;font-size:13px;color:#3D4A54;margin-bottom:12px}
.det div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #f0f2f5;padding:6px 0}
.det b{color:#1a1a1a;text-align:right}
.cargando{text-align:center;padding:50px 20px;color:#8A94A0;font-size:14px}
.vacio{text-align:center;padding:30px 20px;color:#8A94A0;font-size:13.5px}
/* ---- tabla usuarios ---- */
table{width:100%;border-collapse:collapse}
th{font-size:10.5px;font-weight:700;letter-spacing:.7px;color:#5A6670;text-align:left;padding:0 8px 8px;border-bottom:1px solid #e5e8ec}
td{font-size:12.5px;color:#3D4A54;padding:9px 8px;border-bottom:1px solid #f0f2f5;vertical-align:middle}
/* ---- modal ---- */
.fondo{position:fixed;inset:0;background:rgba(15,35,55,.45);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
.modal{background:#F4F6F9;border-radius:12px;max-width:640px;width:100%;max-height:92vh;overflow:auto}
.modal .mt{background:#0F3B5C;color:#fff;padding:13px 18px;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;border-radius:12px 12px 0 0;position:sticky;top:0}
.x{cursor:pointer;font-size:20px;line-height:1;opacity:.8}
.mb{padding:16px 18px}
@media(max-width:620px){.det{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<script>
var SES = '', CTX = null, LISTAS = null, TAB = '', CACHE = [], PROV = null, RES = null;
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function pesos(n){ n=Math.round(Number(n)||0); return '$ '+n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.'); }
function limpio(v){ return String(v||'').replace(/[^0-9]/g,''); }
function fila(k,v){ return '<div><span>'+esc(k)+'</span><b>'+esc(v)+'</b></div>'; }
/* ================= ENTRADA ================= */
function pantallaLogin(msg){
$('app').innerHTML =
'<div class="login"><div class="lbox">'+
'<div class="lhead"><h1>SOCIAL SOLAR S.A.S.</h1><p>Órdenes de compra</p></div>'+
'<div class="lbody">'+
(msg? '<div class="caja cno" style="margin-top:0;margin-bottom:14px">'+esc(msg)+'</div>':'')+
'<div class="g"><label>Usuario</label><input id="lu" autocomplete="username" placeholder="su usuario"></div>'+
'<div class="g"><label>Contraseña</label><input id="lp" type="password" autocomplete="current-password" placeholder="su contraseña"></div>'+
'<button class="btn" style="width:100%" id="lb" onclick="entrar()">Entrar</button>'+
'<div style="font-size:11.8px;color:#8A94A0;margin-top:14px;line-height:1.6">'+
'Si no tiene usuario o se le olvidó la contraseña, pídaselo a <b>Angie Céspedes</b> (contabilidad). '+
'Cada persona entra con el suyo: lo que usted registre queda a su nombre.'+
'</div>'+
'</div>'+
'</div></div>';
$('lp').onkeydown = function(e){ if(e.key==='Enter') entrar(); };
$('lu').focus();
}
function entrar(){
var u = $('lu').value.trim(), p = $('lp').value;
if(!u || !p){ pantallaLogin('Escriba su usuario y su contraseña.'); return; }
$('lb').disabled = true; $('lb').textContent = 'Entrando…';
google.script.run.withSuccessHandler(function(r){
if(!r || !r.ok){ pantallaLogin(r? r.mensaje : 'No pude conectarme. Intente otra vez.'); return; }
SES = r.ses; CTX = r;
google.script.run.withSuccessHandler(function(l){ LISTAS = l; marco(); }).api('ocListas', SES);
}).withFailureHandler(function(err){
pantallaLogin('No pude conectarme: ' + String(err));
}).api('ocEntrar', u, p);
}
function salir(){ SES=''; CTX=null; pantallaLogin(''); }
/* ================= MARCO ================= */
function marco(){
$('app').innerHTML =
'<div class="top">'+
'<div><h1>SOCIAL SOLAR S.A.S. — ÓRDENES DE COMPRA</h1>'+
'<div class="yo">'+esc(CTX.nombre)+' · '+esc(CTX.area)+'</div></div>'+
'<div class="der">'+
'<span class="pill inf">'+esc(CTX.rol)+'</span>'+
'<span class="lnk" onclick="verCambiarClave()">Cambiar mi contraseña</span>'+
'<span class="lnk" onclick="salir()">Salir</span>'+
'</div>'+
'</div><div class="rayita"></div>'+
'<div class="tabs" id="tabs"></div>'+
'<div class="wrap" id="wrap"><div class="cargando">Un momento…</div></div>';
pintarTabs();
}
function listaTabs(){
var t = [];
if(CTX.puede.solicitar) t.push(['nueva','Nueva orden']);
if(CTX.puede.aprobar)   t.push(['aprobar','Por aprobar']);
if(CTX.puede.pagar)     t.push(['pagar','Por pagar']);
if(CTX.puede.pagar)     t.push(['pagos','Pagos']);
if(CTX.puede.facturar)  t.push(['facturar','Mercancía y factura']);
if(CTX.puede.causar)    t.push(['causar','Por causar']);
t.push(['legalizar','Sin legalizar']);
if(CTX.puede.solicitar) t.push(['mias','Mis órdenes']);
t.push(['todas', CTX.puede.vertodo ? 'Todas' : 'Las de mi área']);
if(CTX.puede.usuarios)  t.push(['usuarios','Usuarios']);
return t;
}
function pintarTabs(){
var t = listaTabs();
$('tabs').innerHTML = t.map(function(x){
return '<div class="tab" id="tab_'+x[0]+'" onclick="irA(\''+x[0]+'\')">'+x[1]+'<span class="n" id="n_'+x[0]+'" style="display:none"></span></div>';
}).join('');
irA(t[0][0]);
}
function irA(id){
TAB = id;
var ts = document.querySelectorAll('.tab');
for(var i=0;i<ts.length;i++) ts[i].className = 'tab';
if($('tab_'+id)) $('tab_'+id).className = 'tab on';
if(id === 'nueva')         pantallaNueva();
else if(id === 'usuarios') pantallaUsuarios();
else if(id === 'pagos')    pantallaPagos();
else                       cargarLista(id);
}
/* ================= GUÍAS ================= */
var GUIAS = {
nueva: ['Cómo pedir una compra',
['Escriba el <b>NIT del proveedor</b> y oprima Buscar. El sistema le dice ahí mismo si está al día.',
'Diga <b>qué va a comprar</b> y escoja el <b>centro de costo</b>. Si es un proyecto nuevo, créelo con «+ Crear un centro de costo nuevo»: código de cotización y nombre del proyecto.',
'Suba la <b>cotización</b> del proveedor.',
'Escriba la <b>base</b> y el <b>IVA</b> tal como vienen en la cotización. El sistema calcula las retenciones solo.',
'Oprima <b>Enviar a aprobación de gerencia</b>.'],
'Mientras gerencia no apruebe, usted puede reemplazar la cotización si se equivocó de archivo. Después ya no.'],
aprobar: ['Qué hace usted aquí',
['Abra cada orden y revise <b>quién la pide</b>, el <b>centro de costo</b> y el <b>valor</b>.',
'Oprima <b>Ver cotización</b> para mirar el soporte del proveedor.',
'Si está de acuerdo: <b>Aprobar y pasar a tesorería</b>.',
'Si no: <b>Rechazar</b> y escriba el motivo. Vuelve al área para que la corrijan.'],
'Aprobar no es pagar. Después de usted, tesorería verifica los documentos del proveedor y hace el pago.'],
pagar: ['Qué hace usted aquí',
['Confirme que el proveedor diga <b>VIGENTE</b>. Si no, no pague todavía.',
'Escoja el <b>tipo de pago</b>: total, abono, anticipo o contra cotización.',
'Escriba el <b>valor pagado</b>, el banco y el número del comprobante de egreso.',
'Suba el <b>soporte del pago</b> y guarde.'],
'Si es un abono, la orden queda abierta con el saldo pendiente y se puede volver a pagar después.'],
facturar: ['Qué hace usted aquí',
['Confirme si <b>llegó la mercancía</b>, quién la recibió y en qué fecha.',
'Diga si llegó <b>factura electrónica</b> o <b>documento soporte</b>, con número, fecha y valor.',
'Suba el archivo de la factura.',
'Si todavía no llega, use <b>Ver el mensaje para pedirle la factura</b> y mándelo por WhatsApp.'],
'Si el valor facturado no cuadra con la orden, el sistema no deja cerrar. Revise antes.'],
causar: ['Qué hace usted aquí',
['Abra la orden y revise la factura adjunta.',
'Cause la compra en World Office como siempre.',
'Vuelva aquí y márquela como <b>causada</b>.'],
'Una orden marcada como causada sale de todos los pendientes.'],
legalizar: ['Plata que ya salió y todavía no se puede causar',
['Aquí están las compras <b>ya pagadas</b> a las que les falta la factura o el documento soporte.',
'Entre más días lleven, más riesgo: el IVA no se puede descontar hasta que llegue el soporte.',
'Desde cada orden puede mandarle el mensaje al proveedor.'],
'Esta lista debería estar vacía. Si crece, es plata de la empresa sin soportar.'],
mias: ['Las órdenes que usted pidió',
['Aquí ve solo lo que usted mismo solicitó, en el estado en que va.',
'Cuando tesorería pague, le aparece el <b>soporte de pago</b> para ver o descargar.',
'Usted no puede editar nada de aquí: es solo consulta.'],
''],
todas: ['', [], ''],
pagos: ['Todos los pagos de la empresa, en una sola hoja',
['Aquí están <b>todos</b> los pagos: los que salen de una orden de compra y los que no (nómina, PSE, impuestos).',
'Cada pago se sube <b>uno por uno, por tercero</b>, con su propio soporte. Así queda la trazabilidad y se le puede mandar al proveedor.',
'Los que dicen <b>Falta completar</b> están incompletos: les hace falta la identificación, el comprobante de egreso o el soporte. Ábralos y complételos.',
'Los que dicen <b>No salió del banco</b> aparecieron registrados aquí pero no están en el extracto. Hay que rehacer el pago o corregir el registro.',
'Con <b>Enviar soporte</b> le llega al proveedor el PDF adjunto al correo. No necesita acceso a Drive.'],
'La validación contra el extracto se actualiza desde la hoja, con el botón «Actualizar y revisar pagos» del menú Social Solar.'],
usuarios: ['Usted administra quién entra',
['Para agregar a alguien: nombre, usuario, contraseña, rol y área.',
'El <b>rol</b> define qué puede hacer. El <b>área</b> define qué alcanza a ver.',
'Para cambiarle la contraseña a alguien, escríbala encima y guarde.',
'Para quitarle el acceso, póngalo en <b>INACTIVO</b>. Sus órdenes quedan con su nombre.'],
'Ingeniería y Sistema de gestión solo ven las órdenes de su propia área. Administración, Compras, Gerencia, Tesorería y Contabilidad ven todas.']
};
function pintarGuia(id){
var g = GUIAS[id];
if(!g || !g[0]) return '';
return '<div class="guia"><h3>'+g[0]+'</h3><ol>'+
g[1].map(function(x){ return '<li>'+x+'</li>'; }).join('')+
'</ol>'+(g[2]? '<p>'+g[2]+'</p>':'')+'</div>';
}
/* ================= NUEVA ORDEN ================= */
function pantallaNueva(){
var cen = '<option value="">— Escoja el centro de costo —</option>'+
(LISTAS.centros||[]).map(function(c){
return '<option value="'+esc(c.codigo)+'">'+esc(c.codigo)+' · '+esc(c.nombre)+'</option>';
}).join('')+
'<option value="__NUEVO__">+ Crear un centro de costo nuevo…</option>';
var con = (LISTAS.conceptos||[]).map(function(c){ return '<option>'+esc(c)+'</option>'; }).join('');
var are = (LISTAS.areas||[]).map(function(a){
return '<option'+(a===CTX.area?' selected':'')+'>'+esc(a)+'</option>';
}).join('');
$('wrap').innerHTML = pintarGuia('nueva')+
'<div class="card">'+
'<div class="sec">1 · EL PROVEEDOR</div>'+
'<div class="row">'+
'<div class="g"><label>NIT (sin dígito de verificación)</label><input id="nit" inputmode="numeric" placeholder="860531287" onblur="buscarProv()"></div>'+
'<div style="flex:0 0 auto;display:flex;align-items:flex-end;padding-bottom:12px"><button class="btn2" onclick="buscarProv()">Buscar</button></div>'+
'</div>'+
'<div id="prov"></div>'+
'</div>'+
'<div class="card">'+
'<div class="sec">2 · QUÉ SE VA A COMPRAR</div>'+
'<div class="g"><label>Descripción</label><input id="desc" placeholder="Cable 250 MCM — 180 m — obra El Zipa"></div>'+
'<div class="row">'+
'<div class="g"><label>Centro de costo</label><select id="centro" onchange="cambioCentro()">'+cen+'</select></div>'+
'<div class="g"><label>Área que solicita</label><select id="area">'+are+'</select></div>'+
'</div>'+
'<div id="centroNuevo" style="display:none;background:#F7F9FB;border:1px solid #d6dbe0;border-radius:8px;padding:14px 16px;margin-bottom:12px">'+
'<div style="font-size:12.5px;font-weight:600;color:#3D4A54;margin-bottom:10px">Centro de costo nuevo</div>'+
'<div class="row">'+
'<div class="g"><label>Código de cotización</label><input id="ccCod" placeholder="CSS-01226"></div>'+
'<div class="g"><label>Nombre del proyecto</label><input id="ccNom" placeholder="Ladrillos El Zipa"></div>'+
'</div>'+
'<button class="btn2" id="ccBtn" onclick="guardarCentro()">Crear y usarlo en esta orden</button>'+
'<div style="font-size:11.5px;color:#8A94A0;margin-top:9px">Queda marcado como POR VALIDAR en la hoja de centros de costo, para que contabilidad lo confirme.</div>'+
'</div>'+
'<div class="row">'+
'<div class="g"><label>Concepto</label><select id="concepto" onchange="recalcular()">'+con+'</select></div>'+
'<div class="g"><label>Fecha en que se necesita</label><input id="fnec" type="date"></div>'+
'</div>'+
'<div class="g"><label>Cotización del proveedor</label><input id="cot" type="file"></div>'+
'<div class="row">'+
'<div class="g"><label>Base</label><input id="base" inputmode="numeric" placeholder="28400000" oninput="recalcular()"></div>'+
'<div class="g"><label>IVA</label><input id="iva" inputmode="numeric" placeholder="5396000" oninput="recalcular()"></div>'+
'<div class="g"><label>Valor total</label><input id="total" readonly style="background:#F7F9FB;font-weight:700;color:#0F3B5C"></div>'+
'</div>'+
'<div class="g"><label><input type="checkbox" id="decl" checked onchange="recalcular()" style="width:auto;margin-right:7px">El proveedor es declarante de renta</label></div>'+
'<div class="g"><label>Observaciones (opcional)</label><textarea id="obs"></textarea></div>'+
'</div>'+
'<div class="card">'+
'<div class="sec" style="color:#0F3B5C">3 · LO QUE EL SISTEMA CALCULA</div>'+
'<div id="calc"><div class="vacio">Escriba la base y escoja el concepto.</div></div>'+
'</div>'+
'<button class="btn" style="width:100%" id="enviar" onclick="enviarOrden()">Enviar a aprobación de gerencia</button>'+
'<div style="height:24px"></div>';
}
function cambioCentro(){
$('centroNuevo').style.display = ($('centro').value === '__NUEVO__') ? 'block' : 'none';
}
function guardarCentro(){
var cod = $('ccCod').value, nom = $('ccNom').value;
if(!cod.trim() || !nom.trim()){ alert('Escriba el código de cotización y el nombre del proyecto.'); return; }
$('ccBtn').disabled = true;
google.script.run.withSuccessHandler(function(r){
$('ccBtn').disabled = false;
if(!r.ok){ alert(r.mensaje); return; }
var s = $('centro');
var o = document.createElement('option');
o.value = r.codigo; o.text = r.codigo + ' · ' + r.nombre;
s.insertBefore(o, s.options[s.options.length-1]);
s.value = r.codigo;
cambioCentro();
}).withFailureHandler(function(e){
$('ccBtn').disabled = false; alert('No pude crear el centro de costo: '+String(e));
}).api('ocCrearCentro', SES, cod, nom);
}
function buscarProv(){
var n = limpio($('nit').value);
if(!n){ $('prov').innerHTML=''; PROV=null; return; }
$('prov').innerHTML = '<div class="caja cav">Buscando…</div>';
google.script.run.withSuccessHandler(function(r){
PROV = r;
if(!r.encontrado){

var MESES = ['','enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function pantallaPagos(){
$('wrap').innerHTML = '<div class="cargando">Cargando los pagos…</div>';

function mesDe(f){ var p = String(f||'').split('/'); return p.length===3 ? p[1]+'/'+p[2] : ''; }
function mesNombre(m){ var p = m.split('/'); return (MESES[Number(p[0])]||m)+' '+p[1]; }
function mesesDePagos(){
var vistos = {}, lista = [];
for(var i=0;i<PAGOS.length;i++){ var m = mesDe(PAGOS[i].fecha); if(m && !vistos[m]){ vistos[m]=1; lista.push(m); } }
lista.sort(function(a,b){ var x=a.split('/'), y=b.split('/'); return (y[1]+y[0]) > (x[1]+x[0]) ? 1 : -1; });
return lista;
}
function tercerosDePagos(){
var vistos = {}, lista = [];
for(var i=0;i<PAGOS.length;i++){ var t = PAGOS[i].proveedor; if(t && !vistos[t]){ vistos[t]=1; lista.push(t); } }
lista.sort();
return lista;
}
function pagosFiltrados(){
var q = PF.q.toLowerCase();
return PAGOS.filter(function(p){
if(PF.estado==='incompletos' && p.completo) return false;
if(PF.estado==='nosalio'     && !p.noSalio) return false;
if(PF.estado==='sinaviso'    && !(p.tipo==='PROVEEDOR' && p.soporte && !p.aviso)) return false;
if(PF.mes  && mesDe(p.fecha) !== PF.mes)  return false;
if(PF.tipo && p.tipo !== PF.tipo) return false;
if(q && (p.proveedor+' '+p.nit+' '+p.numero+' '+p.observa+' '+p.orden+' '+p.banco).toLowerCase().indexOf(q) < 0) return false;
return true;
});
}

/* El panel de arriba muestra lo que se esta viendo, no la hoja entera:
   si filtra por mes, los numeros son los de ese mes. */
function resumenDe(lista){
var r = { total:lista.length, valor:0, incompletos:0, noSalieron:0, valorNoSalio:0, sinAviso:0 };
for(var i=0;i<lista.length;i++){
var p = lista[i];
r.valor += p.valor;
if(!p.completo) r.incompletos++;
if(p.noSalio){ r.noSalieron++; r.valorNoSalio += p.valor; }
if(p.tipo==='PROVEEDOR' && p.soporte && !p.aviso) r.sinAviso++;
}
return r;
}
function hayFiltro(){ return !!(PF.mes || PF.tipo || PF.q || PF.estado !== 'todos'); }

kpi(s.noSalieron,'no salieron del banco', s.noSalieron? '#B00020':'')+

'<div id="cajaProv">'+
(ops? '<label>Correo del proveedor</label><select id="eSel" onchange="cambioCorreo()">'+ops+'<option value="__OTRO__">Escribir otro correo solo para este envío…</option></select>'
    : '<div class="caja cno">El maestro no tiene correo de este proveedor. Escríbalo abajo: no se guarda en la base.</div>')+
'</div>'+
'<label>Correo al que se envía</label><input id="eCorreo" value="'+esc(ops? (r.contactos.correos[0].correo) : '')+'">'+
'<label>Asunto</label><input id="eAsunto" value="'+esc(r.asunto)+'">'+
'<label>Mensaje</label><textarea id="eTexto" style="height:190px">'+esc(r.mensaje)+'</textarea>'+
'<div class="caja cok" style="margin-top:10px;font-size:12.5px">El PDF va <b>adjunto</b> al correo. El proveedor no necesita acceso a Drive. El maestro de proveedores <b>no se modifica</b>.</div>'+
'<button class="btn" id="eBtn" style="width:100%;margin-top:12px" onclick="enviarSoporte(\''+esc(p.numero)+'\')">Enviar el correo con el soporte</button>'+
'<button class="btn sec" style="width:100%;margin-top:8px" onclick="prepararWhatsapp()">Mandar por WhatsApp (el PDF se adjunta a mano)</button>');
}
function cambioDestino(){
var prov = $('dProv').checked;
$('cajaProv').style.display = prov? 'block' : 'none';
if(!prov){ $('eCorreo').value = ''; $('eCorreo').focus(); }
else if($('eSel') && $('eSel').value !== '__OTRO__') $('eCorreo').value = $('eSel').value;
}
function cambioCorreo(){
var v = $('eSel').value;
if(v === '__OTRO__'){ $('eCorreo').value = ''; $('eCorreo').focus(); }
else $('eCorreo').value = v;
}
function enviarSoporte(num){
var c = $('eCorreo').value.trim();
if(c.indexOf('@') < 1){ alert('Escriba un correo válido.'); return; }
$('eBtn').disabled = true; $('eBtn').textContent = 'Enviando…';
google.script.run.withSuccessHandler(function(r){
$('eBtn').disabled = false; $('eBtn').textContent = 'Enviar el correo con el soporte';
if(!r.ok){ alert(r.mensaje); return; }
abrirModal('Soporte enviado',
'<div class="caja cok">El correo salió para <b>'+esc(r.correo)+'</b> con el PDF adjunto.'+
(r.produccion? '' : '<br><br>Como el sistema está en modo prueba, le llegó a usted y no al destinatario.')+'</div>'+
'<div style="font-size:12.5px;color:#5A6670;margin-top:12px">¿Le avisa también por WhatsApp? El PDF ya le fue por correo; por el chat va solo el aviso.</div>'+
'<button class="btn sec" style="width:100%;margin-top:8px" onclick="prepararWhatsapp()">💬 Avisarle por WhatsApp</button>'+
'<button class="btn" style="width:100%;margin-top:8px" onclick="cerrarModal();pantallaPagos()">Cerrar</button>');
}).api('ocEnviarSoporte', SES, num, { correo: c, asunto: $('eAsunto').value, mensaje: $('eTexto').value });
}
function prepararWhatsapp(){
if(!PENVIO) return;
var interno = $('dInt') && $('dInt').checked;
var lista = (PENVIO.contactos.celulares)||[];
var cel = (!interno && lista.length) ? lista[0].celular : '';
WA_INT = interno;
abrirModal('Mandar el soporte por WhatsApp — pago N° '+PENVIO.pago.numero,
'<div class="caja cav" style="margin-bottom:12px">El botón baja el PDF y abre el chat al tiempo: usted solo lo arrastra o lo adjunta con el clip. '+
'WhatsApp no recibe archivos desde fuera del API de Meta, así que el adjunto tiene que ponerlo usted. '+
'<b>Si quiere que el PDF salga solo, use el correo.</b></div>'+
'<label>Celular (solo números, sin el 57)</label><input id="waCel" value="'+esc(cel)+'" inputmode="numeric" oninput="armarWa()">'+
'<label>Mensaje</label><textarea id="waTxt" style="height:130px" oninput="armarWa()">'+esc(textoWa())+'</textarea>'+
'<a class="btn" id="waLink" target="_blank" style="width:100%;margin-top:14px;display:block;text-align:center;box-sizing:border-box" href="#" onclick="bajarYabrirWa()">⬇💬 Bajar el PDF y abrir WhatsApp</a>'+
'<a class="btn sec" id="waPdf" target="_blank" style="width:100%;margin-top:8px;display:block;text-align:center;box-sizing:border-box" href="'+esc(descargaDrive(PENVIO.pago.soporte))+'">Solo bajar el PDF</a>'+
'<div style="border-top:1px solid #EEF1F4;margin-top:14px;padding-top:12px">'+
'<div style="font-size:12.5px;color:#5A6670;margin-bottom:8px">O en vez de adjuntarlo, mándele un enlace para que él lo descargue:</div>'+
'<button class="btn sec" id="waEnl" style="width:100%" onclick="agregarEnlaceWa(\''+esc(PENVIO.pago.numero)+'\')">🔗 Agregar enlace de descarga al mensaje</button>'+
'<div id="waAviso" style="font-size:12px;color:#8A6D1F;margin-top:8px">Eso abre <b>ese solo PDF</b> a cualquiera que tenga el enlace. La carpeta de soportes no se toca.</div>'+
'</div>');
armarWa();
}
/* Abre ese unico PDF por enlace y lo mete en el mensaje. */
function agregarEnlaceWa(num){
var b = $('waEnl');
b.disabled = true; b.textContent = 'Abriendo el archivo…';
google.script.run.withSuccessHandler(function(r){
if(!r.ok){
b.disabled = false; b.textContent = '🔗 Agregar enlace de descarga al mensaje';
$('waAviso').innerHTML = '<span style="color:#B00020">'+esc(r.mensaje)+'</span>';
return;
}
b.textContent = '✓ Enlace agregado';
var t = $('waTxt');
if(t.value.indexOf(r.enlace) < 0) t.value = t.value + '\n\nDescargue el soporte aquí: ' + r.enlace;
armarWa();
$('waAviso').innerHTML = 'Listo. Ese PDF queda abierto a quien tenga el enlace; los demás soportes siguen cerrados.';
}).api('ocEnlaceSoporte', SES, num);
}
/* Un solo clic: dispara la descarga del PDF y deja que el enlace abra el chat. */
function bajarYabrirWa(){
marcarWa();
try { window.open(descargaDrive(PENVIO.pago.soporte), '_blank'); } catch(e) {}
}
var WA_INT = false;
/* Enlace de descarga directa del soporte, para poder adjuntarlo a mano. */
function descargaDrive(link){
var m = String(link||'').match(/[-\w]{25,}/);
return m ? 'https://drive.google.com/uc?export=download&id='+m[0] : String(link||'#');
}
/* En el mensaje no va ningún enlace: el proveedor no tiene acceso a Drive
   y el soporte se adjunta a mano o se manda por correo. */
function textoWa(){
return PENVIO.whatsapp;
}
function armarWa(){
var cel = limpio($('waCel').value);
$('waLink').href = 'https://wa.me/' + (cel? '57'+cel : '') + '?text=' + encodeURIComponent($('waTxt').value);
}
function marcarWa(){
var cel = limpio($('waCel').value);
if(!cel) return;
google.script.run.api('ocMarcarWhatsapp', SES, PENVIO.pago.numero, cel);
}
/* ================= MODAL ================= */
function abrirModal(titulo, html){
$('modal').innerHTML =
'<div class="fondo" onclick="if(event.target===this)cerrarModal()">'+
'<div class="modal"><div class="mt"><span>'+esc(titulo)+'</span><span class="x" onclick="cerrarModal()">×</span></div>'+
'<div class="mb">'+html+'</div></div></div>';
}
function cerrarModal(){ $('modal').innerHTML = ''; }
/* ================= ARRANQUE ================= */
pantallaLogin('');
</script>
</body>
</html>
